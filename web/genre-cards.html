<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibelton Genre Cards</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .genre-page {
        min-height: 100dvh;
        padding: 48px 20px;
      }

      .genre-shell {
        display: grid;
        gap: 28px;
        margin: 0 auto;
        width: min(960px, 100%);
      }

      .genre-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
      }

      .genre-header h1,
      .genre-section h2 {
        margin: 0;
      }

      .genre-header a {
        color: var(--accent);
        font-weight: 800;
        text-decoration: none;
      }

      .genre-section {
        display: grid;
        gap: 14px;
      }

      .genre-parent-card {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .genre-parent-card summary {
        cursor: pointer;
        list-style: none;
        padding: 16px;
      }

      .genre-parent-card summary::-webkit-details-marker {
        display: none;
      }

      .genre-parent-card summary span {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .genre-parent-card summary span::after {
        color: var(--muted);
        content: "▸";
      }

      .genre-parent-card[open] summary span::after {
        color: var(--accent);
        transform: rotate(90deg);
      }

      .genre-sub-cards,
      .direct-genre-grid {
        display: grid;
        gap: 8px;
      }

      .genre-sub-cards {
        padding: 8px 16px 16px;
      }

      .direct-genre-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .genre-subline {
        color: var(--muted);
        display: block;
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .genre-description {
        color: var(--muted);
        margin: 0;
      }

      .genre-form {
        display: grid;
        gap: 10px;
      }

      .genre-form label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .genre-form textarea {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        min-height: 128px;
        padding: 14px;
        resize: vertical;
      }

      .genre-result {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--soft);
        margin: 0;
        max-height: 360px;
        overflow: auto;
        padding: 16px;
        white-space: pre-wrap;
      }

      @media (prefers-reduced-motion: no-preference) {
        .genre-parent-card summary span::after,
        .prompt-button {
          transition: color 200ms ease, transform 200ms ease, border-color 200ms ease;
        }
      }

      @media (max-width: 760px) {
        .genre-page {
          padding: 28px 14px;
        }

        .genre-header {
          align-items: start;
          flex-direction: column;
        }

        .direct-genre-grid {
          grid-template-columns: 1fr;
        }

        .genre-parent-card summary span {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="genre-page">
      <section class="genre-shell" aria-labelledby="genre-heading">
        <header class="genre-header">
          <div>
            <p class="eyebrow">Genre Cards</p>
            <h1>Pick your sound</h1>
          </div>
          <a href="/">Back to Vibelton</a>
        </header>

        <section class="genre-section" aria-labelledby="genre-heading">
          <h2 id="genre-heading">House sub-genres</h2>
          <details class="genre-parent-card">
            <summary>
              <span>
                <strong>House</strong>
                <small class="genre-subline">16 detailed sub-genre prompts</small>
              </span>
            </summary>
            <div class="genre-sub-cards" id="houseSubgenreCards"></div>
          </details>

          <div class="direct-genre-grid">
            <button class="prompt-button genre-card" type="button" data-prompt="Create an expanded Techno song sketch with a hypnotic pulse, dark texture, machine-like drums, and slow-building pressure.">
              <span>Techno</span>
              <small class="genre-subline">125–135 BPM · Hypnotic · Machine-like</small>
              <p class="genre-description">Steady club pressure built from repetition, dark texture, and small changes over time.</p>
            </button>
            <button class="prompt-button genre-card" type="button" data-prompt="Create an expanded UK Garage song sketch with skippy two-step drums, soulful chords, vocal-chop energy, and bouncy sub bass.">
              <span>UK Garage</span>
              <small class="genre-subline">130–136 BPM · Skippy · Swung</small>
              <p class="genre-description">Bouncy two-step drums, soulful chords, and sub bass that moves around the groove.</p>
            </button>
            <button class="prompt-button genre-card" type="button" data-prompt="Create an expanded Trap song sketch with sparse half-time drums, tuned 808 bass, fast hi-hat rolls, and a dark melodic hook.">
              <span>Trap</span>
              <small class="genre-subline">130–150 BPM · Sparse · 808-led</small>
              <p class="genre-description">Half-time drums, tuned 808 bass, fast hats, and a moody melodic loop.</p>
            </button>
          </div>
        </section>

        <form class="genre-form" id="genreComposer">
          <label for="genrePrompt">Prompt</label>
          <textarea id="genrePrompt" rows="5" placeholder="Choose a genre card or write a prompt..."></textarea>
          <div class="actions">
            <button class="secondary-button" type="button" id="copyPrompt">Copy</button>
            <button class="primary-button" type="submit">Send to Ableton</button>
          </div>
        </form>

        <pre class="genre-result" id="genreResult" hidden></pre>
      </section>
    </main>

    <script src="/house-subgenre-cards.js"></script>
    <script>
      const prompt = document.querySelector("#genrePrompt");
      const result = document.querySelector("#genreResult");
      const houseSubgenreCards = document.querySelector("#houseSubgenreCards");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      houseSubgenreCards.innerHTML = (window.HOUSE_SUBGENRE_CARDS || [])
        .map(
          (card) => `
            <button class="prompt-button genre-card" type="button" data-prompt="${escapeHtml(card.prompt)}">
              <span>${escapeHtml(card.label)}</span>
              <small class="genre-subline">${escapeHtml(card.subline)}</small>
              <p class="genre-description">${escapeHtml(card.description)}</p>
            </button>`
        )
        .join("");

      document.querySelectorAll(".genre-card").forEach((button) => {
        button.addEventListener("click", () => {
          prompt.value = button.dataset.prompt || "";
          result.hidden = true;
          prompt.focus();
        });
      });

      document.querySelector("#copyPrompt").addEventListener("click", async () => {
        if (!prompt.value.trim()) return;
        await navigator.clipboard.writeText(prompt.value);
      });

      document.querySelector("#genreComposer").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!prompt.value.trim()) return;
        result.hidden = false;
        result.textContent = "Sending...";
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: prompt.value }),
        });
        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      });
    </script>
  </body>
</html>
